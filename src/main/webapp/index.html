<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            min-height: 100vh;
        }


        .landing-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px;
        }


        .landing-card {
            width: 100%;
            max-width: 1000px;

            background: white;

            padding: 50px;

            border-radius: 20px;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.10);

            text-align: center;
        }


        .landing-card h1 {
            font-size: 48px;
            color: #1e4fa3;
            margin-bottom: 10px;
        }


        .tagline {
            font-size: 20px;
            color: #555;
            margin-bottom: 25px;
        }


        .welcome-text {
            font-size: 28px;
            font-weight: bold;
            color: #222;
            margin-bottom: 10px;
        }


        .description {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
        }


        .login-options {
            display: flex;
            justify-content: center;
            gap: 30px;
        }


        .login-box {
            width: 400px;

            border: 1px solid #ddd;

            border-radius: 15px;

            padding: 35px 25px;

            background: #fafafa;

            transition: 0.3s;
        }


        .login-box:hover {
            transform: translateY(-5px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.12);
        }


        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }


        .login-box h2 {
            font-size: 28px;
            color: #222;
            margin-bottom: 15px;
        }


        .login-box p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }


        .login-box button {
            border: none;

            background: #1e63d5;

            color: white;

            font-size: 16px;

            padding: 12px 28px;

            border-radius: 8px;

            cursor: pointer;

            transition: 0.3s;
        }


        .login-box button:hover {
            background: #164fae;
        }


        @media (max-width: 800px) {

            .login-options {
                flex-direction: column;
                align-items: center;
            }


            .login-box {
                width: 100%;
                max-width: 400px;
            }


            .landing-card {
                padding: 30px 20px;
            }


            .landing-card h1 {
                font-size: 38px;
            }

        }

    </style>

</head>


<body>


    <div class="landing-container">


        <div class="landing-card">


            <h1>
                CareerConnect
            </h1>


            <p class="tagline">
                Job & Placement Management Portal
            </p>


            <p class="welcome-text">
                Welcome to CareerConnect
            </p>


            <p class="description">
                Connect students with opportunities
                and manage placements efficiently.
            </p>



            <div class="login-options">


                <!-- ADMIN LOGIN -->

                <div class="login-box">

                    <div class="icon">
                        👨‍💼
                    </div>


                    <h2>
                        Admin
                    </h2>


                    <p>
                        Manage jobs, applications
                        and student placements.
                    </p>


                    <button
                        onclick="goToAdminLogin()">

                        Admin Login

                    </button>

                </div>



                <!-- STUDENT LOGIN -->

                <div class="login-box">

                    <div class="icon">
                        🎓
                    </div>


                    <h2>
                        Student
                    </h2>


                    <p>
                        Find jobs, apply for opportunities
                        and track your applications.
                    </p>


                    <button
                        onclick="goToStudentLogin()">

                        Student Login

                    </button>

                </div>


            </div>


        </div>


    </div>



    <script>

    function goToAdminLogin() {

        window.location.href =
            "login.html?role=ADMIN";

    }


    function goToStudentLogin() {

        window.location.href =
            "login.html?role=STUDENT";

    }

    </script>


</body>

</html>
