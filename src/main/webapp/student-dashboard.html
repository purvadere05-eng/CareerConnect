<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Student Dashboard</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <div class="container py-5">


        <!-- Heading -->

        <h1 class="text-center fw-bold">
            CareerConnect
        </h1>

        <h2 class="text-center mt-3">
            Student Dashboard
        </h2>

        <p class="text-center text-muted mb-5">
            Welcome to CareerConnect!
        </p>


        <!-- Dashboard Cards -->

        <div class="row g-4 justify-content-center">


            <!-- My Profile -->

            <div class="col-md-4">

                <div class="card h-100 shadow-sm text-center">

                    <div class="card-body p-4">

                        <h3 class="card-title">
                            👤 My Profile
                        </h3>

                        <p class="card-text text-muted">
                            View and update your profile
                            information.
                        </p>

                        <a
                            href="profile.html"
                            class="btn btn-primary">

                            My Profile

                        </a>

                    </div>

                </div>

            </div>


            <!-- Browse Jobs -->

            <div class="col-md-4">

                <div class="card h-100 shadow-sm text-center">

                    <div class="card-body p-4">

                        <h3 class="card-title">
                            💼 Browse Jobs
                        </h3>

                        <p class="card-text text-muted">
                            Find jobs posted by companies.
                        </p>

                        <a
                            href="student-jobs.html"
                            class="btn btn-primary">

                            Browse Jobs

                        </a>

                    </div>

                </div>

            </div>


            <!-- My Applications -->

            <div class="col-md-4">

                <div class="card h-100 shadow-sm text-center">

                    <div class="card-body p-4">

                        <h3 class="card-title">
                            📄 My Applications
                        </h3>

                        <p class="card-text text-muted">
                            Track your job applications
                            and their status.
                        </p>

                        <a
                            href="my-applications.html"
                            class="btn btn-primary">

                            My Applications

                        </a>

                    </div>

                </div>

            </div>


        </div>


        <!-- Logout -->

        <div class="text-center mt-5">

            <a
                href="logout"
                class="btn btn-outline-danger px-4">

                🚪 Logout

            </a>

        </div>


    </div>

</body>

</html>
