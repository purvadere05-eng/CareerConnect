<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Registration</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center">

        <div class="w-100" style="max-width: 620px;">

            <!-- Heading -->
            <div class="text-center mb-3">

                <h1 class="fw-bold text-primary mb-1">
                    CareerConnect
                </h1>

                <h3 class="fw-semibold mb-0">
                    Student Registration
                </h3>

            </div>


            <!-- Registration Card -->
            <div class="card border-0 shadow">

                <div class="card-body p-3">

                    <form action="register" method="post">

                        <div class="row g-2">

                            <!-- Full Name -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold mb-1">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    name="fullName"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Username -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold mb-1">
                                    Username
                                </label>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Password -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold mb-1">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Email -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold mb-1">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Phone -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold mb-1">
                                    Phone
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    required>

                            </div>


                            <!-- Qualification -->
                            <div class="col-md-6">

                                <label class="form-label fw-semibold mb-1">
                                    Qualification
                                </label>

                                <input
                                    type="text"
                                    name="qualification"
                                    class="form-control"
                                    placeholder="e.g. BCS"
                                    required>

                            </div>


                     


                        <!-- Register -->
                        <div class="text-center mt-3">

                            <button
                                type="submit"
                                class="btn btn-primary px-4">

                                Register

                            </button>

                        </div>


                        <!-- Login -->
                        <div class="text-center mt-2">

                            <small class="text-muted">
                                Already have an account?
                            </small>

                           <a
    href="login.html?role=STUDENT"
    class="text-decoration-none fw-semibold">

    Login

</a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
