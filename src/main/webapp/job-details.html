<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Job Details</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <!-- Main Container -->

    <div class="container py-5">


        <!-- Heading -->

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                CareerConnect
            </h1>

            <h2 class="mt-3">
                Job Details
            </h2>

        </div>


        <!-- Job Details Card -->

        <div class="card shadow-sm mx-auto job-details-card">

            <div class="card-body p-4 p-md-5">


                <!-- Job Details -->

                <div id="jobDetails">

                    <div class="text-center text-muted">

                        Loading job details...

                    </div>

                </div>


                <!-- Apply Button -->

                <div class="text-center mt-4">

                    <button
                        id="applyButton"
                        type="button"
                        class="btn btn-primary px-4">

                        📝 Apply Now

                    </button>

                </div>


                <!-- Back Button -->

                <div class="text-center mt-3">

                    <button
                        type="button"
                        class="btn btn-outline-secondary px-4"
                        onclick="window.location.href='student-jobs.html'">

                        ← Back to Jobs

                    </button>

                </div>


            </div>

        </div>


    </div>


    <!-- Existing JavaScript -->

    <script src="js/job-details.js"></script>


</body>

</html>
