<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Login</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <div class="container">


        <!-- Header -->

        <div class="text-center mt-5 mb-4">

            <h1 class="fw-bold">
                CareerConnect
            </h1>

            <h2 class="mt-3"
                id="loginTitle">

                Login

            </h2>

            <p class="text-muted"
               id="loginDescription">

                Login to continue to your account

            </p>

        </div>



        <!-- Login Card -->

        <div class="card shadow-sm mx-auto"
             style="max-width: 500px;">

            <div class="card-body p-4">


                <form action="login"
                      method="post">


                    <!-- Username -->

                    <div class="mb-3">

                        <label for="username"
                               class="form-label fw-semibold">

                            Username

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            required>

                    </div>



                    <!-- Password -->

                    <div class="mb-4">

                        <label for="password"
                               class="form-label fw-semibold">

                            Password

                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required>

                    </div>



                    <!-- Login Button -->

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-primary">

                            Login

                        </button>

                    </div>


                </form>


            </div>

        </div>



        <!-- Student Registration -->

        <div class="text-center mt-4"
             id="registerSection">

            <p class="text-muted">

                Don't have an account?

                <a href="register.html"
                   class="text-decoration-none fw-semibold">

                    Register

                </a>

            </p>

        </div>


    </div>



    <!-- ROLE HANDLING -->

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );


        const role =
            params.get("role");


        const loginTitle =
            document.getElementById(
                "loginTitle"
            );


        const loginDescription =
            document.getElementById(
                "loginDescription"
            );


        const registerSection =
            document.getElementById(
                "registerSection"
            );


        // ADMIN LOGIN

        if (role === "ADMIN") {

            loginTitle.textContent =
                "Admin Login";

            loginDescription.textContent =
                "Login to access the Admin Dashboard";


            // Hide student registration

            registerSection.style.display =
                "none";

        }


        // STUDENT LOGIN

        else if (role === "STUDENT") {

            loginTitle.textContent =
                "Student Login";

            loginDescription.textContent =
                "Login to access your Student Dashboard";


            // Show registration

            registerSection.style.display =
                "block";

        }


        // DEFAULT

        else {

            loginTitle.textContent =
                "Login";

            loginDescription.textContent =
                "Login to continue to your account";

        }

    </script>


</body>

</html>
