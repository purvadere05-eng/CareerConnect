<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Apply for Job</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <div class="container py-5">

        <!-- Heading -->

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                CareerConnect
            </h1>

            <h2 class="mt-3">
                Apply for Job
            </h2>

            <p class="text-muted">
                Submit your application
            </p>

        </div>


        <!-- Application Card -->

        <div class="card shadow-sm mx-auto"
             style="max-width: 700px;">

            <div class="card-body p-4 p-md-5">


                <!-- Job Information -->

                <h4 class="mb-4">
                    Job Information
                </h4>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Job Title
                    </label>

                    <input
                        type="text"
                        id="jobTitle"
                        class="form-control"
                        readonly>

                </div>


                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Company
                    </label>

                    <input
                        type="text"
                        id="company"
                        class="form-control"
                        readonly>

                </div>


                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        class="form-control"
                        readonly>

                </div>


                <hr>


                <!-- Application Form -->

                <h4 class="mb-4">
                    Application Details
                </h4>


                <form
                    id="applicationForm"
                    action="student/apply"
                    method="post"
                    enctype="multipart/form-data">


                    <!-- Hidden Job ID -->

                    <input
                        type="hidden"
                        id="jobId"
                        name="jobId">


                    <!-- Resume -->

                    <div class="mb-4">

                        <label
                            for="resume"
                            class="form-label fw-semibold">

                            Resume

                        </label>

                        <input
                            type="file"
                            id="resume"
                            name="resume"
                            class="form-control"
                            accept=".pdf,.doc,.docx"
                            required>

                        <div class="form-text">
                            PDF, DOC or DOCX only. Maximum size: 5 MB.
                        </div>

                    </div>


                    <!-- Cover Letter -->

                    <div class="mb-4">

                        <label
                            for="coverLetter"
                            class="form-label fw-semibold">

                            Cover Letter

                        </label>

                        <textarea
                            id="coverLetter"
                            name="coverLetter"
                            class="form-control"
                            rows="6"
                            placeholder="Write a short message to the employer..."></textarea>

                    </div>


                    <!-- Submit -->

                    <div class="text-center">

                        <button
                            type="submit"
                            id="submitApplication"
                            class="btn btn-primary px-4">

                            📝 Submit Application

                        </button>

                    </div>


                </form>


                <!-- Message -->

                <div
                    id="message"
                    class="mt-4">
                </div>


            </div>

        </div>


        <!-- Back -->

        <div class="text-center mt-4">

            <a href="student-jobs.html"
               class="text-decoration-none">

                ← Back to Jobs

            </a>

        </div>

    </div>


    <!-- Application JavaScript -->

    <script src="js/application-form.js"></script>

</body>

</html>
