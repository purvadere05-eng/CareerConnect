<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Edit Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <h1>Edit Profile</h1>

    <div class="profile-card">

        <h2>Update Profile</h2>

        <form id="updateProfileForm">

            <label>Full Name</label>

            <input type="text"
                   id="editFullName"
                   required>

            <br><br>


            <label>Email</label>

            <input type="email"
                   id="editEmail"
                   required>

            <br><br>


            <label>Phone</label>

            <input type="text"
                   id="editPhone"
                   required>

            <br><br>


            <label>Qualification</label>

            <input type="text"
                   id="editQualification"
                   required>

            <br><br>


            <label>Skills</label>

            <input type="text"
                   id="editSkills"
                   required>

            <br><br>


            <button type="submit">
                Update Profile
            </button>

            <button type="button"
                    onclick="window.location.href='profile.html'">
                Cancel
            </button>

        </form>

    </div>


    <script src="js/edit-profile.js"></script>

</body>

</html>
