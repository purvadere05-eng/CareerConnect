<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Profile</title>


    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <!-- Main Container -->

    <div class="container py-5">


        <!-- Page Heading -->

        <div class="text-center mb-4">

            <h1 class="fw-bold">
                My Profile
            </h1>

            <p class="text-muted">
                View and manage your CareerConnect profile
            </p>

        </div>


        <!-- Profile Card -->

        <div class="card shadow-sm mx-auto profile-card"
             style="max-width: 650px;">


            <div class="card-body p-4 p-md-5">


                <!-- Profile Photo -->

                <div class="text-center mb-4">

                    <img
                        id="profilePhoto"
                        src="profile-image"
                        alt="Profile Photo"
                        class="rounded-circle border shadow-sm"
                        width="140"
                        height="140"
                        style="object-fit: cover;">


                    <div class="mt-3">

                        <input
                            type="file"
                            id="photoInput"
                            accept="image/*"
                            class="form-control mx-auto"
                            style="max-width: 300px;">

                    </div>


                    <button
                        type="button"
                        onclick="uploadPhoto()"
                        class="btn btn-outline-primary mt-3">

                        📷 Change Photo

                    </button>

                </div>


                <hr class="my-4">


                <!-- Profile Information -->

                <div class="profile-information">


                    <!-- Name -->

                    <div class="profile-row">

                        <strong>
                            Name
                        </strong>

                        <span id="fullName">
                        </span>

                    </div>


                    <!-- Email -->

                    <div class="profile-row">

                        <strong>
                            Email
                        </strong>

                        <span id="email">
                        </span>

                    </div>


                    <!-- Phone -->

                    <div class="profile-row">

                        <strong>
                            Phone
                        </strong>

                        <span id="phone">
                        </span>

                    </div>


                    <!-- Qualification -->

                    <div class="profile-row">

                        <strong>
                            Qualification
                        </strong>

                        <span id="qualification">
                        </span>

                    </div>


                    <!-- Skills -->

                    <div class="profile-row">

                        <strong>
                            Skills
                        </strong>

                        <span id="skills">
                        </span>

                    </div>


                </div>


                <!-- Edit Button -->

                <div class="text-center mt-4">

                    <button
                        type="button"
                        onclick="window.location.href='edit-profile.html'"
                        class="btn btn-primary px-4">

                        ✏️ Edit Profile

                    </button>

                </div>


            </div>

        </div>


        <!-- Back to Dashboard -->

        <div class="text-center mt-4">

            <a href="student-dashboard.html"
               class="text-decoration-none">

                ← Back to Dashboard

            </a>

        </div>


    </div>


    <!-- Existing JavaScript -->

    <script src="js/profile.js"></script>


</body>

</html>
