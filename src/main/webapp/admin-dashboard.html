<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>CareerConnect - Admin Dashboard</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- Custom CSS -->

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>


    <div class="container py-5">


        <!-- Header -->

        <div class="text-center mb-5">

            <h1 class="fw-bold">
                CareerConnect
            </h1>

            <h2 class="mt-3">
                Admin Dashboard
            </h2>

            <p class="text-muted">
                Manage jobs and student applications
            </p>

        </div>


        <!-- Welcome -->

        <div class="card shadow-sm mx-auto mb-4"
             style="max-width: 800px;">

            <div class="card-body text-center p-4">

                <h4>
                    👨‍💼 Welcome Admin!
                </h4>

                <p class="text-muted mb-0">
                    Manage jobs and applications from one place.
                </p>

            </div>

        </div>


        <!-- Dashboard Options -->

        <div class="row justify-content-center g-4">


            <!-- Manage Jobs -->

            <div class="col-md-5">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center p-4">

                        <div class="fs-1 mb-3">
                            💼
                        </div>

                        <h4>
                            Manage Jobs
                        </h4>

                        <p class="text-muted">
                            Add and manage job postings.
                        </p>

                        <a
                            href="admin-jobs.html"
                            class="btn btn-primary">

                            Manage Jobs

                        </a>

                    </div>

                </div>

            </div>


            <!-- Manage Applications -->

            <div class="col-md-5">

                <div class="card shadow-sm h-100">

                    <div class="card-body text-center p-4">

                        <div class="fs-1 mb-3">
                            📋
                        </div>

                        <h4>
                            Manage Applications
                        </h4>

                        <p class="text-muted">
                            View and manage student applications.
                        </p>

                        <a
                            href="admin-applications.html"
                            class="btn btn-success">

                            Manage Applications

                        </a>

                    </div>

                </div>

            </div>


        </div>


        <!-- Logout -->

        <div class="text-center mt-5">

            <a
                href="logout"
                class="btn btn-outline-danger px-4">

                🚪 Logout

            </a>

        </div>


    </div>


</body>

</html>
